<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raft Cluster Operations Console</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #111110;
    --bg-2:     #1A1A19;
    --bg-3:     #222220;
    --bg-4:     #2A2A28;
    --dim:      #363633;
    --muted:    #5E5E58;
    --sub:      #888880;
    --text:     #D4D4CC;
    --bright:   #EEEEE6;
    --rule:     #222220;
    --amber:    #E8890C;
    --amber-2:  #F2A93B;
    --amber-bg: #1C1608;
    --green:    #4A9E5C;
    --green-bg: #0A180C;
    --red:      #C85050;
    --red-bg:   #1A0A0A;
    --blue:     #4A80C8;
    --blue-bg:  #080E1A;
    --sans:     -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono:     ui-monospace, "Cascadia Code", "Menlo", "Consolas", monospace;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  .console {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  .masthead {
    border-bottom: 1px solid var(--rule);
    padding: 22px 0 14px;
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
  }
  .masthead-eyebrow {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .masthead-wordmark {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.025em;
    color: var(--bright);
  }
  .masthead-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .poll-status {
    font-size: 11px;
    color: var(--muted);
  }
  .leader-badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--amber);
    background: var(--amber-bg);
    border: 1px solid #36280A;
    padding: 3px 10px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .no-leader {
    font-size: 11px;
    color: var(--muted);
  }

  .config-bar {
    border-bottom: 1px solid var(--rule);
    padding: 9px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .config-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .config-input {
    flex: 1;
    min-width: 260px;
    font-family: var(--mono);
    font-size: 11px;
    background: var(--bg-2);
    border: 1px solid var(--dim);
    color: var(--text);
    padding: 5px 9px;
    outline: none;
  }
  .config-input:focus { border-color: var(--amber); }
  .btn {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--dim);
    padding: 5px 14px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--bg-4); border-color: var(--sub); }
  .btn:active { border-color: var(--amber); color: var(--amber); }
  .btn-primary {
    background: var(--amber);
    color: #0C0700;
    border-color: var(--amber);
    font-weight: 700;
  }
  .btn-primary:hover { background: var(--amber-2); border-color: var(--amber-2); color: #0C0700; }

  .section-label {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  .ticker {
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 5px 0;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    margin: 10px 0;
  }

  .body-split {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 0 28px;
    align-items: start;
  }
  @media (max-width: 820px) { .body-split { grid-template-columns: 1fr; } }

  .topology-panel {
    border-right: 1px solid var(--rule);
    padding-right: 28px;
  }
  @media (max-width: 820px) {
    .topology-panel { border-right: none; border-bottom: 1px solid var(--rule); padding-right: 0; padding-bottom: 18px; margin-bottom: 4px; }
  }
  #topology-svg { width: 100%; height: 290px; display: block; }

  .node-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .node-card {
    background: var(--bg);
    padding: 13px 14px;
    border-top: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .node-card.role-leader    { background: var(--amber-bg); border-top-color: var(--amber); }
  .node-card.role-follower  { border-top-color: var(--dim); }
  .node-card.role-candidate { background: var(--blue-bg); border-top-color: var(--blue); }
  .node-card.role-down      { background: var(--bg-2); border-top-color: var(--red); opacity: 0.55; }

  @keyframes commit-flash {
    0%   { background: #2C1E06; }
    100% { background: inherit; }
  }
  .node-card.pulsing { animation: commit-flash 0.55s ease-out; }

  .card-role {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .role-leader   .card-role { color: var(--amber); }
  .role-follower .card-role { color: var(--muted); }
  .role-candidate .card-role { color: var(--blue); }
  .role-down     .card-role { color: var(--red); }

  .card-id {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--bright);
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .role-down .card-id { color: var(--muted); text-decoration: line-through; }

  .card-addr {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .card-stats {
    border-top: 1px solid var(--rule);
    padding-top: 9px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
  }
  .stat-item { display: flex; flex-direction: column; gap: 1px; }
  .stat-key {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    font-weight: 500;
  }
  .role-down .stat-val { color: var(--muted); }

  .card-peers {
    border-top: 1px solid var(--rule);
    margin-top: 9px;
    padding-top: 6px;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    word-break: break-all;
  }

  .ops-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }
  @media (max-width: 680px) { .ops-row { grid-template-columns: 1fr; } }

  .ops-box { background: var(--bg); padding: 14px 16px; }
  .ops-box-title {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .kv-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .kv-form input {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg-2);
    border: 1px solid var(--dim);
    color: var(--text);
    padding: 6px 9px;
    outline: none;
    width: 100%;
  }
  .kv-form input:focus { border-color: var(--amber); }
  .kv-form input::placeholder { color: var(--muted); }
  .kv-actions { display: flex; gap: 6px; }

  .kv-result {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11px;
    min-height: 18px;
    color: var(--muted);
    border-left: 2px solid var(--dim);
    padding-left: 8px;
  }
  .kv-result.ok  { border-color: var(--green); color: var(--green); }
  .kv-result.err { border-color: var(--red); color: var(--red); }

  .log-area { height: 175px; overflow-y: auto; }
  .log-entry {
    display: grid;
    grid-template-columns: 62px 1fr;
    gap: 0 8px;
    padding: 3px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 11px;
    line-height: 1.5;
  }
  .log-time { font-family: var(--mono); color: var(--muted); }
  .log-msg  { color: var(--sub); word-break: break-all; }
  .log-ok   .log-msg { color: var(--green); }
  .log-err  .log-msg { color: var(--red); }
</style>
</head>
<body>
<div class="console">

  <header class="masthead">
    <div>
      <div class="masthead-eyebrow">Raft Distributed KV Store</div>
      <div class="masthead-wordmark">Operations Console</div>
    </div>
    <div class="masthead-right">
      <span class="poll-status" id="live-label">connecting...</span>
      <span id="leader-display"><span class="no-leader">no leader</span></span>
    </div>
  </header>

  <div class="config-bar">
    <span class="config-label">Nodes</span>
    <input class="config-input" id="nodes-input"
      value="http://localhost:8001,http://localhost:8002,http://localhost:8003,http://localhost:8004,http://localhost:8005">
    <button class="btn" id="apply-btn">Apply</button>
  </div>

  <div class="ticker"><span id="ticker-inner">Initializing cluster poll...</span></div>

  <div class="section-label">Cluster topology</div>
  <div class="body-split">
    <div class="topology-panel">
      <svg id="topology-svg" viewBox="0 0 320 290" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#363633"/>
          </marker>
          <marker id="arr-amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#E8890C"/>
          </marker>
        </defs>
      </svg>
    </div>
    <div>
      <div class="node-grid" id="node-grid"></div>
    </div>
  </div>

  <div class="section-label">Operations</div>
  <div class="ops-row">
    <div class="ops-box">
      <div class="ops-box-title">Key / Value</div>
      <div class="kv-form">
        <input id="kv-key"   placeholder="key"   autocomplete="off" spellcheck="false">
        <input id="kv-value" placeholder="value" autocomplete="off" spellcheck="false">
      </div>
      <div class="kv-actions">
        <button class="btn btn-primary" id="set-btn">Set</button>
        <button class="btn" id="get-btn">Get</button>
      </div>
      <div class="kv-result" id="kv-result"></div>
    </div>
    <div class="ops-box">
      <div class="ops-box-title">Activity log</div>
      <div class="log-area" id="log-area"></div>
    </div>
  </div>

</div>
<script>
let nodeURLs = parseNodes(document.getElementById("nodes-input").value);
let prevCommit = {};
let pollTimers = [];
let nodeStates = {};

document.getElementById("apply-btn").addEventListener("click", () => {
  nodeURLs = parseNodes(document.getElementById("nodes-input").value);
  prevCommit = {};
  restartPolling();
});

function parseNodes(str) {
  return str.split(",").map(s => s.trim()).filter(Boolean);
}

function restartPolling() {
  pollTimers.forEach(clearTimeout);
  pollTimers = [];
  nodeStates = {};
  nodeURLs.forEach(url => pollNode(url));
}

function pollNode(url) {
  fetchStatus(url).then(data => {
    const prev = (nodeStates[url] || {}).data;
    nodeStates[url] = { status: "ok", data };
    if (prev && prev.commitIndex !== undefined && data.commitIndex > prev.commitIndex) {
      markPulse(url);
    }
    renderAll();
  }).catch(() => {
    nodeStates[url] = { status: "down", url };
    renderAll();
  }).finally(() => {
    const t = setTimeout(() => pollNode(url), 600);
    pollTimers.push(t);
  });
}

async function fetchStatus(url) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 1200);
  try {
    const r = await fetch(url + "/status", { signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally {
    clearTimeout(tid);
  }
}

function renderAll() {
  const entries = nodeURLs.map(url => {
    const s = nodeStates[url];
    if (!s) return { url, role: null, status: "pending" };
    if (s.status === "down") return { url, role: "down", status: "down" };
    return { url, role: s.data.role || "unknown", status: "ok", data: s.data };
  });
  const leaderEntry = entries.find(e => e.role === "leader");
  updateMasthead(leaderEntry, entries);
  renderGrid(entries);
  renderTopology(entries);
  updateTicker(entries);
}

function updateMasthead(leaderEntry, entries) {
  const label = document.getElementById("live-label");
  const leaderDisp = document.getElementById("leader-display");
  const anyOk = entries.some(e => e.status === "ok");
  label.textContent = anyOk ? "polling" : "connecting...";
  if (leaderEntry) {
    const id = leaderEntry.data.nodeId || "?";
    const term = leaderEntry.data.term != null ? "  t=" + leaderEntry.data.term : "";
    leaderDisp.innerHTML = "<span class=\"leader-badge\">Leader: " + escHtml(id) + escHtml(term) + "</span>";
  } else {
    const anyCand = entries.some(e => e.role === "candidate");
    leaderDisp.innerHTML = "<span class=\"no-leader\">" + (anyCand ? "electing..." : "no leader") + "</span>";
  }
}

function renderGrid(entries) {
  const grid = document.getElementById("node-grid");
  const existing = grid.querySelectorAll(".node-card");
  if (existing.length !== entries.length) {
    grid.innerHTML = "";
    entries.forEach(e => {
      const card = document.createElement("div");
      card.className = "node-card";
      card.dataset.url = e.url;
      grid.appendChild(card);
    });
  }
  grid.querySelectorAll(".node-card").forEach((card, i) => {
    const e = entries[i];
    if (!e) return;
    const roleCls = e.role ? "role-" + e.role : "";
    const wasPulsing = card.classList.contains("pulsing");
    card.className = "node-card" + (roleCls ? " " + roleCls : "") + (wasPulsing ? " pulsing" : "");
    card.dataset.url = e.url;
    card.innerHTML = buildCardHTML(e);
  });
}

function buildCardHTML(e) {
  if (e.status === "pending") {
    return "<div class=\"card-role\">pending</div><div class=\"card-id\">-</div><div class=\"card-addr\">" + escHtml(e.url) + "</div>";
  }
  if (e.status === "down") {
    return "<div class=\"card-role\">unreachable</div><div class=\"card-id\">down</div><div class=\"card-addr\">" + escHtml(e.url) + "</div><div class=\"card-stats\"><div class=\"stat-item\"><span class=\"stat-key\">status</span><span class=\"stat-val\">offline</span></div></div>";
  }
  const d = e.data;
  const peers = (d.peers || []).join(", ") || "-";
  return (
    "<div class=\"card-role\">" + escHtml(d.role || "?") + "</div>" +
    "<div class=\"card-id\">" + escHtml(d.nodeId || "?") + "</div>" +
    "<div class=\"card-addr\">" + escHtml(e.url) + "</div>" +
    "<div class=\"card-stats\">" +
      stat("Term", d.term) + stat("Commit", d.commitIndex) +
      stat("Applied", d.lastApplied) + stat("Log", d.logLen) +
      stat("Keys", d.keys) + stat("Snap", d.snapshotIndex) +
      stat("Read", d.readMode || "-") + stat("Leader", d.leader || "-") +
    "</div>" +
    "<div class=\"card-peers\">peers: " + escHtml(peers) + "</div>"
  );
}

function stat(k, v) {
  return "<div class=\"stat-item\"><span class=\"stat-key\">" + k + "</span><span class=\"stat-val\">" + escHtml(String(v != null ? v : "-")) + "</span></div>";
}

function renderTopology(entries) {
  const svg = document.getElementById("topology-svg");
  const defsHTML = svg.querySelector("defs").outerHTML;
  svg.innerHTML = defsHTML;

  const W = 320, H = 290, cx = W / 2, cy = H / 2 - 8, r = 94;

  entries.forEach((e, i) => {
    const angle = (2 * Math.PI * i / entries.length) - Math.PI / 2;
    e._x = cx + r * Math.cos(angle);
    e._y = cy + r * Math.sin(angle);
  });

  const leaderIdx = entries.findIndex(e => e.role === "leader");

  if (leaderIdx >= 0) {
    const leader = entries[leaderIdx];
    entries.forEach((e, i) => {
      if (i === leaderIdx) return;
      const isDown = e.role === "down" || e.status !== "ok";
      svg.appendChild(svgEl("line", {
        x1: leader._x, y1: leader._y, x2: e._x, y2: e._y,
        stroke: isDown ? "#363633" : "#E8890C",
        "stroke-width": isDown ? "1" : "1.5",
        "stroke-dasharray": isDown ? "4 3" : "none",
        opacity: isDown ? "0.35" : "0.5",
        "marker-end": isDown ? "url(#arr)" : "url(#arr-amber)"
      }));
    });
  } else {
    entries.forEach((e, i) => {
      const next = entries[(i + 1) % entries.length];
      svg.appendChild(svgEl("line", {
        x1: e._x, y1: e._y, x2: next._x, y2: next._y,
        stroke: "#2A2A28", "stroke-width": "1", "stroke-dasharray": "4 3", opacity: "0.8"
      }));
    });
  }

  entries.forEach(e => {
    const x = e._x, y = e._y;
    const isLeader = e.role === "leader";
    const isDown   = e.role === "down" || e.status !== "ok";
    const isCand   = e.role === "candidate";
    const nr = isLeader ? 25 : 19;

    svg.appendChild(svgEl("circle", {
      cx: x, cy: y, r: nr,
      fill:   isLeader ? "#1C1608" : isDown ? "#161615" : isCand ? "#080E1A" : "#161615",
      stroke: isLeader ? "#E8890C" : isDown ? "#363633" : isCand ? "#4A80C8" : "#363633",
      "stroke-width": isLeader ? "1.5" : "1"
    }));

    const nid = (e.data && e.data.nodeId) || (e.url ? e.url.replace(/.*localhost:/, ":") : "?");
    const lbl = svgEl("text", {
      x, y: y + 1, "text-anchor": "middle", "dominant-baseline": "middle",
      "font-family": "ui-monospace, Menlo, monospace",
      "font-size": isLeader ? "11" : "10", "font-weight": "700",
      fill: isLeader ? "#E8890C" : isDown ? "#3A3A37" : isCand ? "#4A80C8" : "#888880"
    });
    lbl.textContent = nid;
    svg.appendChild(lbl);

    const rl = svgEl("text", {
      x, y: y + nr + 11, "text-anchor": "middle",
      "font-family": "-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif",
      "font-size": "8", "font-weight": "600", "letter-spacing": "0.1em",
      fill: isLeader ? "#7A4500" : isDown ? "#363633" : isCand ? "#2A4A78" : "#3A3A37"
    });
    rl.textContent = (e.role || "pending").toUpperCase();
    svg.appendChild(rl);

    if (isLeader && e.data) {
      const tb = svgEl("text", {
        x, y: y + nr + 21, "text-anchor": "middle",
        "font-family": "ui-monospace, Menlo, monospace",
        "font-size": "8", fill: "#3A3A37"
      });
      tb.textContent = "t=" + e.data.term;
      svg.appendChild(tb);
    }
  });
}

function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function markPulse(url) {
  const grid = document.getElementById("node-grid");
  const card = grid.querySelector("[data-url=\"" + CSS.escape(url) + "\"]");
  if (!card) return;
  card.classList.remove("pulsing");
  void card.offsetWidth;
  card.classList.add("pulsing");
  setTimeout(() => card.classList.remove("pulsing"), 650);
}

function updateTicker(entries) {
  const parts = entries.map(e => {
    if (e.status === "down" || e.role === "down") return (e.data && e.data.nodeId || e.url) + ":DOWN";
    if (!e.data) return "?:pending";
    return e.data.nodeId + ":" + e.data.role.toUpperCase() + " t=" + e.data.term + " ci=" + e.data.commitIndex + " k=" + e.data.keys;
  });
  document.getElementById("ticker-inner").textContent = parts.join("   |   ");
}

function findLeaderURL() {
  for (const url of nodeURLs) {
    const s = nodeStates[url];
    if (s && s.status === "ok" && s.data && s.data.role === "leader") return url;
  }
  return nodeURLs[0] || null;
}

function grpcPortToHTTP(grpcAddr) {
  if (!grpcAddr) return null;
  const m = grpcAddr.match(/:(\d+)$/);
  if (!m) return null;
  return "http://" + grpcAddr.replace(/:\d+$/, "") + ":" + (parseInt(m[1]) - 1000);
}

document.getElementById("set-btn").addEventListener("click", async () => {
  const key   = document.getElementById("kv-key").value.trim();
  const value = document.getElementById("kv-value").value.trim();
  if (!key) { setResult("err", "key required"); return; }
  const url = findLeaderURL();
  if (!url) { setResult("err", "no node available"); return; }
  await doSet(url, key, value, 0);
});

async function doSet(url, key, value, depth) {
  if (depth > 3) { setResult("err", "too many redirects"); return; }
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 3000);
  try {
    const r = await fetch(url + "/set?key=" + encodeURIComponent(key) + "&value=" + encodeURIComponent(value), { signal: ctrl.signal });
    clearTimeout(tid);
    const j = await r.json();
    if (j.ok) {
      setResult("ok", "set ok: " + key + " = " + value);
      logEntry("ok", "SET " + key + "=" + value + " @ " + url);
    } else if (j.leaderHint) {
      const redirect = grpcPortToHTTP(j.leaderHint);
      if (redirect) { logEntry("", "redirect to " + redirect); await doSet(redirect, key, value, depth + 1); }
      else { setResult("err", j.error || "set failed"); logEntry("err", "SET " + key + ": " + (j.error || "no leader")); }
    } else {
      setResult("err", j.error || "set failed");
      logEntry("err", "SET " + key + ": " + (j.error || "?"));
    }
  } catch (err) {
    clearTimeout(tid);
    setResult("err", "request failed");
    logEntry("err", "SET " + key + " failed: " + err.message);
  }
}

document.getElementById("get-btn").addEventListener("click", async () => {
  const key = document.getElementById("kv-key").value.trim();
  if (!key) { setResult("err", "key required"); return; }
  const url = findLeaderURL();
  if (!url) { setResult("err", "no node available"); return; }
  await doGet(url, key, 0);
});

async function doGet(url, key, depth) {
  if (depth > 3) { setResult("err", "too many redirects"); return; }
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 3000);
  try {
    const r = await fetch(url + "/get?key=" + encodeURIComponent(key), { signal: ctrl.signal });
    clearTimeout(tid);
    const j = await r.json();
    if (j.found) {
      setResult("ok", key + " = " + j.value);
      logEntry("ok", "GET " + key + " = " + j.value);
    } else if (j.leaderHint) {
      const redirect = grpcPortToHTTP(j.leaderHint);
      if (redirect) await doGet(redirect, key, depth + 1);
      else { setResult("err", "not found"); logEntry("err", "GET " + key + ": not found"); }
    } else {
      setResult("ok", key + ": not found");
      logEntry("ok", "GET " + key + ": not found");
    }
  } catch (err) {
    clearTimeout(tid);
    setResult("err", "request failed");
    logEntry("err", "GET " + key + " failed: " + err.message);
  }
}

function setResult(type, msg) {
  const el = document.getElementById("kv-result");
  el.textContent = msg;
  el.className = "kv-result" + (type ? " " + type : "");
}

function logEntry(type, msg) {
  const log = document.getElementById("log-area");
  const ts = new Date().toTimeString().slice(0, 8);
  const div = document.createElement("div");
  div.className = "log-entry" + (type ? " log-" + type : "");
  div.innerHTML = "<span class=\"log-time\">" + ts + "</span><span class=\"log-msg\">" + escHtml(msg) + "</span>";
  log.insertBefore(div, log.firstChild);
  while (log.children.length > 60) log.removeChild(log.lastChild);
}

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

restartPolling();
</script>
</body>
